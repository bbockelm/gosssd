name: Build Container

on:
  workflow_call:
    outputs:
      image:
        description: Container image name
        value: ${{ jobs.build.outputs.image }}
      dockerfile-changed:
        description: Whether Dockerfile changed
        value: ${{ jobs.build.outputs.dockerfile-changed }}
  schedule:
  - cron: 0 0 * * 0      # Weekly on Sunday at midnight UTC
  push:
    branches: [main, master]
    paths:
    - .devcontainer/Dockerfile
    - .devcontainer/.dockerignore
    - .pre-commit-config.yaml
    tags:
    - v*

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      dockerfile-changed: ${{ steps.changes.outputs.dockerfile }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check if Dockerfile changed
      id: changes
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          # For PRs, compare with the base branch
          if git diff origin/${{ github.base_ref }}...HEAD --quiet -- .devcontainer/Dockerfile 2>/dev/null; then
            echo "dockerfile=false" >> $GITHUB_OUTPUT
          else
            echo "dockerfile=true" >> $GITHUB_OUTPUT
          fi
        else
          # For pushes, compare with previous commit
          if git diff HEAD~1 HEAD --quiet -- .devcontainer/Dockerfile 2>/dev/null; then
            echo "dockerfile=false" >> $GITHUB_OUTPUT
          else
            echo "dockerfile=true" >> $GITHUB_OUTPUT
          fi
        fi

  build-arch:
    needs: detect-changes
    if: needs.detect-changes.outputs.dockerfile-changed == 'true' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        include:
        - platform: linux/amd64
          runner: ubuntu-latest
        - platform: linux/arm64
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up QEMU
      if: matrix.runner == 'ubuntu-latest'
      uses: docker/setup-qemu-action@v3
      with:
        platforms: ${{ matrix.platform }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=semver,pattern=latest

    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: .devcontainer/Dockerfile
        platforms: ${{ matrix.platform }}
        labels: ${{ steps.meta.outputs.labels }}
        outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
        cache-from: type=gha,scope=${{ matrix.platform }}
        cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

    - name: Export digest
      run: |
        mkdir -p /tmp/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "/tmp/digests/${digest#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@v4
      with:
        name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1

  merge:
    needs: build-arch
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
    - name: Download digests
      uses: actions/download-artifact@v4
      with:
        pattern: digests-*
        path: /tmp/digests
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=semver,pattern=latest

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Create manifest list and push
      working-directory: /tmp/digests
      run: |
        docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
          $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

    - name: Inspect image
      run: |
        docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}

  build:
    needs: detect-changes
    if: always() && needs.detect-changes.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      dockerfile-changed: ${{ needs.detect-changes.outputs.dockerfile-changed }}
    steps:
    - uses: actions/checkout@v4

    - name: Set image output
      id: image
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          if [[ "${{ needs.detect-changes.outputs.dockerfile-changed }}" == "true" ]]; then
            echo "name=gosssd-dev:pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
          else
            echo "name=ghcr.io/${{ github.repository }}:latest" >> $GITHUB_OUTPUT
          fi
        elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
          echo "name=ghcr.io/${{ github.repository }}:${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        else
          echo "name=ghcr.io/${{ github.repository }}:latest" >> $GITHUB_OUTPUT
        fi

    - name: Set up Docker Buildx
      if: github.event_name == 'pull_request' && needs.detect-changes.outputs.dockerfile-changed == 'true'
      uses: docker/setup-buildx-action@v3

    - name: Build and load image (PRs)
      if: github.event_name == 'pull_request' && needs.detect-changes.outputs.dockerfile-changed == 'true'
      uses: docker/build-push-action@v6
      with:
        context: .
        file: .devcontainer/Dockerfile
        load: true
        tags: gosssd-dev:pr-${{ github.event.number }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Save image as artifact (PRs with Dockerfile changes)
      if: github.event_name == 'pull_request' && needs.detect-changes.outputs.dockerfile-changed == 'true'
      run: |
        docker save gosssd-dev:pr-${{ github.event.number }} | gzip > /tmp/gosssd-image.tar.gz
        ls -lh /tmp/gosssd-image.tar.gz

    - name: Upload image artifact
      if: github.event_name == 'pull_request' && needs.detect-changes.outputs.dockerfile-changed == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: gosssd-image-pr-${{ github.event.number }}
        path: /tmp/gosssd-image.tar.gz
        retention-days: 1
