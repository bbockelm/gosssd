name: Build Container

on:
  workflow_call:
  schedule:
  - cron: 0 0 * * 0      # Weekly on Sunday at midnight UTC

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      dockerfile-changed: ${{ steps.changes.outputs.dockerfile }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check if Dockerfile changed
      id: changes
      run: |
        if git diff HEAD~1 HEAD --quiet -- .devcontainer/Dockerfile 2>/dev/null; then
          echo "dockerfile=false" >> $GITHUB_OUTPUT
        else
          echo "dockerfile=true" >> $GITHUB_OUTPUT
        fi

  build:
    needs: detect-changes
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      image: ghcr.io/${{ github.repository }}:latest
    if: needs.detect-changes.outputs.dockerfile-changed == 'true' || github.event_name == 'schedule'
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: .devcontainer
        push: true
        tags: ghcr.io/${{ github.repository }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
