name: Test

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  build-container:
    uses: ./.github/workflows/build-container.yml

  test:
    needs: build-container
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25']
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build container
      uses: docker/build-push-action@v6
      with:
        context: .devcontainer
        load: true
        tags: gosssd-dev:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run tests in container
      run: docker run --rm -v ${{ github.workspace }}:/workspaces/gosssd gosssd-dev:latest bash -c "cd /workspaces/gosssd && go install gotest.tools/gotestsum@latest && gotestsum --format=testname -- -race -coverprofile=coverage.txt -covermode=atomic ./..."

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.txt
        flags: unittests
        fail_ci_if_error: false
