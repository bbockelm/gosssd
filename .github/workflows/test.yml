name: Test

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  packages: write
  contents: read

jobs:
  build-container:
    uses: ./.github/workflows/build-container.yml

  test:
    needs: build-container
    runs-on: ubuntu-latest
    container: ${{ needs.build-container.outputs.image }}
    strategy:
      matrix:
        go-version: ['1.25']
    steps:
    - uses: actions/checkout@v4

    - name: Download and load image artifact (PRs)
      if: github.event_name == 'pull_request'
      uses: actions/download-artifact@v4
      with:
        name: gosssd-image-pr-${{ github.event.number }}
        path: /tmp

    - name: Load image from artifact (PRs)
      if: github.event_name == 'pull_request'
      run: |
        if [ -f /tmp/gosssd-image.tar.gz ]; then
          docker load < /tmp/gosssd-image.tar.gz
        fi

    - name: Run tests
      env:
        GOSSSD_FAIL_BUILD_REQUIRED: 'true'
      run: gotestsum --format=testname -- -race -coverprofile=coverage.txt -covermode=atomic ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.txt
        flags: unittests
        fail_ci_if_error: false
