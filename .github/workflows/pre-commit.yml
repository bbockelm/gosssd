name: Pre-commit

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  build-container:
    uses: ./.github/workflows/build-container.yml

  pre-commit:
    needs: build-container
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build container
      uses: docker/build-push-action@v6
      with:
        context: .devcontainer
        load: true
        tags: gosssd-dev:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run pre-commit in container
      run: docker run --rm -v ${{ github.workspace }}:/workspaces/gosssd gosssd-dev:latest bash -c "cd /workspaces/gosssd && python3 -m pip install --quiet pre-commit && pre-commit run --all-files"
